<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上り抜け - 前日上りタイム抽出 | kogisGDP</title>
    <link rel="stylesheet" href="agari.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⏱️ 上り抜け</h1>
            <p class="subtitle">前日の上りタイムが速かった選手をレースごとに抽出</p>
        </header>

        <main>
            <!-- コントロール -->
            <section class="controls-section">
                <h2>📅 日付とピックアップ人数</h2>
                <div class="controls">
                    <div class="control-group">
                        <label for="dateInput">開催日</label>
                        <div class="date-nav">
                            <button type="button" class="btn btn-secondary" id="prevDay" aria-label="前日">◀</button>
                            <input type="date" id="dateInput">
                            <button type="button" class="btn btn-secondary" id="nextDay" aria-label="翌日">▶</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label for="topNSelect">ピックアップ人数</label>
                        <select id="topNSelect">
                            <option value="1">上位1人</option>
                            <option value="2" selected>上位2人</option>
                            <option value="3">上位3人</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="reloadBtn">&nbsp;</label>
                        <button type="button" class="btn btn-primary" id="reloadBtn">再読み込み</button>
                    </div>
                </div>
                <div class="status-bar hidden" id="statusBar"></div>
            </section>

            <!-- ピックアップ -->
            <section class="pickup-section">
                <h2>🎯 上りピックアップ</h2>
                <div id="pickupContainer"></div>
            </section>

            <!-- 全レース -->
            <section class="all-races-section">
                <h2>📋 全レース</h2>
                <div id="racesContainer"></div>
            </section>

            <!-- 凡例 -->
            <section class="legend-section">
                <div class="legend">
                    「前日上り」はゴール前 200m のタイム（秒）。<strong>小さいほど速い</strong>。<br>
                    タイム数直線は各レースの上りタイムを横軸に並べたもの。左が速く、右が遅い。<br>
                    着順バッジは<strong>前日の着順</strong>。落＝落車、故＝故障で、この2つは上りタイムの記録なし扱い。<br>
                    初日（1日目）の開催は前日成績が存在しないため対象外。
                </div>
            </section>
        </main>

        <footer>
            <p>
                <a href="index.html">予想ボード</a> |
                <a href="bank.html">バンク版</a> |
                <a href="race-merge.html">マージビュー</a> |
                <a href="agari.html">上り抜け</a> |
                <a href="guide/index.html">予想ガイド</a>
            </p>
            <p>kogisGDP - 競輪AI予想システム</p>
        </footer>
    </div>

    <script src="agari.js"></script>
</body>
</html>
